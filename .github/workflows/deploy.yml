name: Sincronizar Notion y desplegar sitio

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *" # cada hora
  repository_dispatch:
    types: [notion-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar contenido desde Notion
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SITE_URL: https://javivedev.github.io
          BASE_PATH: /javivetech-cursos

      - name: Build del sitio
        run: npm run build
        env:
          SITE_URL: https://javivedev.github.io
          BASE_PATH: /javivetech-cursos

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
